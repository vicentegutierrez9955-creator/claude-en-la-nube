<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punto de Venta</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="icon.png">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo">PV</span><span id="brand-name">Punto de Venta</span></div>
    <nav id="mainnav">
      <button data-screen="ventas"><kbd>F1</kbd> Ventas</button>
      <button data-screen="clientes"><kbd>F2</kbd> Clientes</button>
      <button data-screen="productos"><kbd>F3</kbd> Productos</button>
      <button data-screen="inventario"><kbd>F4</kbd> Inventario</button>
      <button data-screen="configuracion">Configuración</button>
      <button data-screen="corte">Corte</button>
      <button data-screen="reportes">Reportes</button>
    </nav>
    <div class="userbox"><span id="user-name"></span> <button id="btn-logout" class="link">Cerrar sesión</button></div>
  </header>
  <main id="screen"></main>
  <footer id="statusbar">
    <span id="status-turno"></span>
    <span id="status-msg"></span>
    <span id="status-clock"></span>
  </footer>
</div>

<div id="login" class="hidden">
  <form id="login-form" class="login-card" autocomplete="off">
    <div class="logo big">PV</div>
    <h1 id="login-title">Punto de Venta</h1>
    <label>Usuario<input name="usuario" required autofocus></label>
    <label>Contraseña<input name="password" type="password"></label>
    <label id="caja-row" class="hidden">Nombre de esta caja / computadora<input name="caja" placeholder="Ej. Caja 1, Mostrador, Bodega"></label>
    <p class="muted small" id="login-caja"></p>
    <button class="primary" type="submit">Entrar</button>
    <p class="muted small" id="login-hint"></p>
    <p class="error" id="login-error"></p>
  </form>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-area"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/JsBarcode.all.min.js"></script>
<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/store.js"></script>
<script src="js/remote.js"></script>
<script src="js/ui.js"></script>
<script src="js/print.js"></script>
<script src="js/ventas.js"></script>
<script src="js/clientes.js"></script>
<script src="js/productos.js"></script>
<script src="js/importar.js"></script>
<script src="js/inventario.js"></script>
<script src="js/configuracion.js"></script>
<script src="js/corte.js"></script>
<script src="js/reportes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
