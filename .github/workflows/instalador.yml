name: Pruebas e instalador de Windows

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador para las pruebas
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta (dos cajas conectadas + base de eleventa)
        run: |
          source tests/preparar-firebird-linux.sh
          node tests/e2e.test.js

  instalador:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Instalar NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Armar instalador
        run: bash installer/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PuntoDeVenta-Instalador
          path: dist/*.exe
          if-no-files-found: error
